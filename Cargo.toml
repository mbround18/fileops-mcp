[workspace]
members = ["apps/*", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
authors = ["Michael Bruno <michael.bruno1337@gmail.com>"]
repository = "https://github.com/mbround18/fileops-mcp"
rust-version = "1.88"

[workspace.dependencies]
fileops-fs = { path = "crates/fileops-fs" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
globset = "0.4"
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
toml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
